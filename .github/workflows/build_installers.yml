name: Build Installers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - mainline
      - release
    paths:
      - "installer/**"
      - "scripts/build_installer*.py"
      - "scripts/common.py"
      - "scripts/find_installbuilder.py"
      - "pyproject.toml"
      - ".github/workflows/build_installers.yml"
  push:
    branches:
      - mainline
      - release
    paths:
      - "installer/**"
      - "scripts/build_installer*.py"
      - "scripts/common.py"
      - "scripts/find_installbuilder.py"
      - "pyproject.toml"
      - ".github/workflows/build_installers.yml"

jobs:
  build-installers:
    name: Build Installers
    uses: aws-deadline/.github/.github/workflows/reusable_build_installers.yml@mainline
    with:
      project_name: deadline-cloud-for-nuke
    secrets: inherit
