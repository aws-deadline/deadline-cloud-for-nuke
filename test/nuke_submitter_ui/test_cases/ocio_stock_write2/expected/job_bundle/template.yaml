specificationVersion: jobtemplate-2023-09
extensions:
- TASK_CHUNKING
name: OCIO Config Job Submission
parameterDefinitions:
- name: NukeScriptFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Nuke Script File
    fileFilters:
    - label: Nuke Script Files
      patterns:
      - '*.nk'
    - label: All Files
      patterns:
      - '*'
  description: The Nuke script file to render.
- name: OCIOConfigPath
  type: PATH
  objectType: FILE
  dataFlow: IN
  description: The OCIO config file used by this job.
- name: Frames
  type: STRING
  description: The frames to render. E.g. 1-3,8,11-15
  minLength: 1
- name: ChunkSize
  type: INT
  default: 1
  minValue: 1
  description: |
    Number of frames per chunk. Use 1 for one frame per task (default). Higher values group frames into chunks to reduce per-task overhead.
  userInterface:
    control: SPIN_BOX
    label: Chunk Size
- name: TargetChunkDuration
  type: INT
  default: 0
  minValue: 0
  description: |
    Optional target duration in seconds per chunk. When set, the scheduler dynamically adjusts chunk sizes based on observed runtimes of completed chunks. Set to 0 to use a fixed chunk size for all chunks.
  userInterface:
    control: SPIN_BOX
    label: Target Chunk Duration (Seconds)
- name: WriteNode
  type: STRING
  userInterface:
    control: DROPDOWN_LIST
    label: Write Node
  description: Which write node to render ('All Write Nodes' for all of them)
  default: All Write Nodes
  allowedValues:
  - All Write Nodes
  - Write1
  - Write2
- name: View
  type: STRING
  userInterface:
    control: DROPDOWN_LIST
  description: Which view to render ('All Views' for all of them)
  default: All Views
  allowedValues:
  - All Views
  - main
- name: ProxyMode
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Proxy Mode
  description: Render in Proxy Mode.
  default: 'false'
  allowedValues:
  - 'true'
  - 'false'
- name: ContinueOnError
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Continue On Error
  description: Continue processing when errors occur.
  default: 'false'
  allowedValues:
  - 'true'
  - 'false'
steps:
- name: Render
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: CHUNK[INT]
      range: '{{Param.Frames}}'
      chunks:
        defaultTaskCount: '{{Param.ChunkSize}}'
        targetRuntimeSeconds: '{{Param.TargetChunkDuration}}'
        rangeConstraint: CONTIGUOUS
  stepEnvironments:
  - name: Nuke
    description: Runs Nuke in the background with a script file loaded.
    script:
      embeddedFiles:
      - name: initData
        filename: init-data.yaml
        type: TEXT
        data: |
          continue_on_error: {{Param.ContinueOnError}}
          proxy: {{Param.ProxyMode}}
          script_file: '{{Param.NukeScriptFile}}'
          write_nodes:
          - '{{Param.WriteNode}}'
          views:
          - '{{Param.View}}'
      actions:
        onEnter:
          command: NukeAdaptor
          args:
          - daemon
          - start
          - --path-mapping-rules
          - file://{{Session.PathMappingRulesFile}}
          - --connection-file
          - '{{Session.WorkingDirectory}}/connection.json'
          - --init-data
          - file://{{ Env.File.initData }}
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
          timeout: 86400
        onExit:
          command: NukeAdaptor
          args:
          - daemon
          - stop
          - --connection-file
          - '{{ Session.WorkingDirectory }}/connection.json'
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
          timeout: 3600
  script:
    embeddedFiles:
    - name: runData
      filename: run-data.yaml
      type: TEXT
      data: 'frameRange: "{{Task.Param.Frame}}"'
    actions:
      onRun:
        command: NukeAdaptor
        args:
        - daemon
        - run
        - --connection-file
        - '{{Session.WorkingDirectory}}/connection.json'
        - --run-data
        - file://{{ Task.File.runData }}
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
        timeout: 518400
description: This test includes a render that includes the use of OCIO color management.
jobEnvironments:
- name: Add OCIO Path to Environment Variable
  variables:
    OCIO: '{{Param.OCIOConfigPath}}'
