specificationVersion: 'jobtemplate-2023-09'
name: Nuke CopyCat Job Template
parameterDefinitions:
- name: CondaPackages
  type: STRING
  description: |
    Choose which Conda packages to install for the render.
    Example usage: nuke=16.* nuke-openjd=0.18.*
  default: nuke=16

- name: NukeScriptFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Nuke Script File
    fileFilters:
    - label: Nuke Script Files
      patterns:
      - '*.nk'
    - label: All Files
      patterns:
      - '*'
  description: The Nuke script file to render.

- name: CopyCatNode
  type: STRING
  description: Which CopyCat node to train

- name: DataDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: INOUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Data Directory
  description: The directory CopyCat data files are read from and written to.

steps:

- name: Train
  parameterSpace:
  script:
    actions:
      onRun:
        command: bash
        args: ['{{Task.File.Run}}']
    embeddedFiles:
    - name: Run
      type: TEXT
      data: |
        #!/bin/env bash

        set -xeuo pipefail

        mkdir -p {{Param.DataDir}}

        ls -l /home/job-user/datadir_mount

        # hack to fix path mapping on the data directory. normal nuke render does this via the adapter.
        # eventually we will do that as well, this is temporary until we add a copycat adapter.
        ESCAPED_DATA_DIR=$(echo "/home/job-user/datadir_mount" | sed 's/\//\\\//g')
        sed -i "s/dataDirectory .*/dataDirectory ${ESCAPED_DATA_DIR}/" {{Param.NukeScriptFile}}

        nuke -F 1 --gpu -X {{Param.CopyCatNode}} {{Param.NukeScriptFile}}